<!-- الصق بعد وحدة الاستبيانات (surveys-module.html) وقبل </body>. يضيف «إنشاء من قالب» في قائمة الاستبيانات. القوالب تُنشأ مسودات فقط. -->
<script>
(()=>{
const o=t=>({id:'o'+uid(),t}),Qn=(t,type,x={})=>({id:'q'+uid(),t,type,req:false,desc:'',...x}),
ch=(t,L,x={})=>Qn(t,'single',{opts:L.map(o),...x}),mu=(t,L,x={})=>Qn(t,'multi',{opts:L.map(o),...x}),
tx=(t,x={})=>Qn(t,'long',x),sh=(t,x={})=>Qn(t,'short',x),yn=t=>Qn(t,'yesno'),
mx=(L)=>Qn('يرجى قراءة العبارات التالية ثم تحديد مستوى موافقتك','matrix',{rows:L.map(t=>({id:'r'+uid(),t}))}),
when=(q,src,v='yes')=>(q.showIf={q:src.id,v},q),
sec=(t,d,questions)=>({id:'s'+uid(),t,d,questions}),
base=(title,descr,audience,secs,x={})=>({id:null,title,descr,audience,status:'draft',accepting:true,opens_at:null,closes_at:null,thanks_msg:'شكرًا لمشاركتكم',closed_msg:'انتهت فترة استقبال الردود، شكرًا لاهتمامكم',collect_identity:false,structure:{sections:secs},...x}),
G3=['أول ثانوي','ثاني ثانوي','ثالث ثانوي'];
const T={
teachers:()=>{const a=yn('هل سبق أن شاركت في تنفيذ برنامج أو فعالية طلابية؟'),b=ch('هل اطلعت على خطة النشاط الطلابي للعام الدراسي؟',['نعم','إلى حد ما','لا']);
return base('استبيان النشاط الطلابي للمعلمين: قياس المشاركة في تنفيذ خطة النشاط الطلابي','نأمل مشاركتكم في هذا الاستبيان بهدف التعرف على مستوى مشاركتكم في الأنشطة الطلابية، ومدى اطلاعكم على خطة النشاط الطلابي، والاستفادة من مقترحاتكم في تطوير البرامج والفعاليات المقدمة للطلاب.','teachers',[
sec('أولًا: البيانات العامة','',[sh('المادة التي تدرسها'),mu('المرحلة',G3),b]),
sec('ثانيًا: المشاركة في خطة النشاط','يرجى وضع علامة أمام مستوى موافقتك على العبارات التالية',[mx(['أحرص على المشاركة في تنفيذ برامج النشاط الطلابي.','أشارك في تنفيذ البرامج المدرجة ضمن خطة النشاط.','أتعاون مع رائد النشاط في تنفيذ البرامج والفعاليات.','أساهم في تشجيع الطلاب على المشاركة في الأنشطة.','أقدم أفكارًا ومقترحات لتطوير النشاط الطلابي.','أرى أن الأنشطة الطلابية تسهم في بناء شخصية الطالب.','تتناسب خطة النشاط مع اهتمامات واحتياجات الطلاب.','يتم التنسيق بين المعلمين ورائد النشاط بشكل مناسب.','تتوفر فرص مناسبة للمعلمين للمشاركة في النشاط.','أرى أن مشاركة المعلمين تسهم في نجاح خطة النشاط.'])]),
sec('ثالثًا: المشاركة الفعلية','',[a,when(mu('إذا كانت الإجابة نعم، فما نوع المشاركة؟ (يمكن اختيار أكثر من خيار)',['إعداد وتنظيم','إشراف ومتابعة','تدريب الطلاب','تحكيم مسابقات','تقديم برنامج أو ورشة'],{other:true}),a),when(tx('ما أبرز برنامج أو فعالية شاركت في تنفيذها؟'),a)]),
sec('رابعًا: مقترحات التطوير','',[tx('ما البرامج والمجالات التي تقترح إضافتها لخطة النشاط؟'),tx('ما أبرز المعوقات التي تحد من مشاركة المعلمين في النشاط؟'),tx('ما المقترحات التي تساعد على زيادة مشاركة المعلمين في خطة النشاط؟')])])},
students:()=>{const a=yn('هل شاركت في الأنشطة الطلابية؟');
return base('استبيان قياس أثر الأنشطة الطلابية على الطلاب','يهدف هذا الاستبيان إلى قياس أثر الأنشطة والبرامج الطلابية في تنمية مهاراتك وشخصيتك، والاستفادة من آرائك في تطوير الأنشطة المقدمة في مدرستنا.','students',[
sec('أولًا: البيانات العامة','',[ch('الصف الدراسي',G3),a,when(tx('إذا كانت الإجابة (لا)، اذكر السبب'),a,'no'),sh('أكثر مجال شاركت فيه')]),
sec('ثانيًا: أثر الأنشطة الطلابية','يرجى قراءة العبارات التالية ثم وضع علامة أمام مستوى موافقتك',[mx(['ساهمت الأنشطة الطلابية في زيادة ثقتي بنفسي.','ساعدتني الأنشطة على اكتشاف مواهبي وقدراتي.','ساهمت الأنشطة في تنمية مهارات التواصل لدي.','ساعدتني الأنشطة على العمل بروح الفريق.','ساهمت الأنشطة في تنمية مهارات القيادة وتحمل المسؤولية.','ساعدتني الأنشطة على استثمار وقت الفراغ بشكل إيجابي.','أسهمت الأنشطة في تعزيز انتمائي للمدرسة.','ساعدتني الأنشطة على اكتساب مهارات وخبرات جديدة.','الأنشطة الطلابية جعلت البيئة المدرسية أكثر جاذبية.','أرى أن الأنشطة الطلابية لها أثر إيجابي في حياتي الدراسية.'])]),
sec('ثالثًا: تقييمك العام','',[ch('ما مدى استفادتك من الأنشطة الطلابية؟',['استفادة كبيرة جدًا','استفادة كبيرة','استفادة متوسطة','استفادة قليلة','لم أستفد']),tx('ما أكثر نشاط كان له أثر إيجابي عليك؟'),tx('ما أبرز مهارة اكتسبتها من الأنشطة الطلابية؟'),tx('ما مقترحاتك لتطوير الأنشطة الطلابية في المدرسة؟')])])},
parents:()=>{const a=yn('هل سبق لابنك المشاركة في الأنشطة الطلابية؟');
return base('استبيان قياس أثر الأنشطة الطلابية من وجهة نظر أولياء الأمور','نسعد بمشاركتكم في هذا الاستبيان الذي يهدف إلى التعرف على مدى انعكاس الأنشطة والبرامج الطلابية المقدمة في المدرسة على شخصية ابنكم ومهاراته وسلوكه، والاستفادة من آرائكم في تطوير الأنشطة والبرامج المستقبلية.','parents',[
sec('أولًا: البيانات العامة','',[ch('صلة القرابة',['أب','أم','ولي أمر آخر']),ch('المرحلة الدراسية لابنكم',G3),a,when(sh('أكثر مجال شارك فيه ابنكم'),a)]),
sec('ثانيًا: أثر الأنشطة الطلابية','يرجى قراءة العبارات التالية ثم وضع علامة أمام مستوى موافقتكم',[mx(['ساهمت الأنشطة الطلابية في زيادة ثقة ابني بنفسه.','ساعدت الأنشطة ابني على اكتشاف مواهبه وقدراته.','ساهمت في تنمية مهارات التواصل والحوار لديه.','عززت لديه روح التعاون والعمل الجماعي.','ساهمت في تنمية مهارات القيادة وتحمل المسؤولية.','ساعدته على استثمار وقت الفراغ بصورة إيجابية.','عززت ارتباطه بالمدرسة وانتماءه إليها.','ساهمت في اكتساب ابني مهارات وخبرات جديدة.','لاحظت تحسنًا إيجابيًا في شخصية ابني نتيجة مشاركته.','أرى أن الأنشطة الطلابية لها أثر إيجابي في حياة ابني الدراسية.'])]),
sec('ثالثًا: تقييم ولي الأمر','',[ch('ما مدى رضاكم عن الأنشطة الطلابية المقدمة في المدرسة؟',['راض جدًا','راض','محايد','غير راض','غير راض بشدة']),tx('ما النشاط أو البرنامج الذي كان له أثر واضح على ابنكم؟'),tx('ما أبرز أثر لاحظتموه على ابنكم نتيجة مشاركته في الأنشطة؟'),tx('ما البرامج أو الأنشطة التي تقترحون إضافتها مستقبلًا؟'),tx('هل لديكم مقترحات لتطوير الأنشطة الطلابية في المدرسة؟')])])},
talents:()=>{const a=yn('هل لديك إنجازات أو مشاركات سابقة؟');
return base('استبيان استكشاف مواهب وهوايات الطلاب','نسعى من خلال هذا الاستبيان إلى التعرف على مواهبك وهواياتك واهتماماتك؛ بهدف اكتشاف قدراتك وتنميتها، وإتاحة الفرص المناسبة لك للمشاركة والإبداع في الأنشطة والبرامج الطلابية.','students',[
sec('أولًا: البيانات الأساسية','تُجمع البيانات التعريفية (الاسم ورقم الجوال والصف) في هذا الاستبيان؛ فهو ليس مجهول الهوية.',[sh('الفصل')]),
sec('ثانيًا: مجالات الموهبة والهواية','حدد المجالات التي تمتلك فيها موهبة أو اهتمامًا (يمكن اختيار أكثر من مجال)',[
mu('الفنون والإبداع',['الرسم والتصوير','الخط العربي','التصميم الجرافيكي','التصوير الفوتوغرافي','المونتاج وصناعة الفيديو','الأشغال اليدوية'],{other:true}),
mu('الإعلام والتواصل',['الإلقاء والخطابة','التقديم والإذاعة','التمثيل المسرحي','كتابة القصص والشعر','صناعة المحتوى','التحدث أمام الجمهور'],{other:true}),
mu('التقنية والابتكار',['البرمجة','الذكاء الاصطناعي','الروبوت والابتكار','الأمن السيبراني','التصميم الرقمي','الألعاب الإلكترونية'],{other:true}),
mu('الرياضة والصحة',['كرة القدم','كرة السلة','ألعاب القوى','اللياقة البدنية','السباحة'],{other:true,desc:'خيار «أخرى» هنا: رياضات أخرى'}),
mu('الثقافة والمعرفة',['القراءة','البحث العلمي','الكتابة والتأليف','المناظرات والحوار','المسابقات الثقافية','اللغات والترجمة'],{other:true}),
tx('مجالات أخرى: اذكر أي موهبة أو هواية أخرى لديك')]),
sec('ثالثًا: مستوى الموهبة','',[ch('كيف تقيّم مستواك في المجال الذي اخترته؟',['مبتدئ','جيد','جيد جدًا','متميز']),a,when(tx('اذكر أبرز إنجازاتك أو مشاركاتك السابقة'),a)]),
sec('رابعًا: اهتماماتك','',[tx('ما المجال الذي ترغب في تطوير موهبتك فيه داخل المدرسة؟'),mu('ما نوع البرامج التي ترغب في المشاركة فيها؟',['دورات تدريبية','مسابقات','معارض','ورش عمل','أندية طلابية','فعاليات ومناسبات مدرسية'],{other:true}),ch('هل ترغب في المشاركة في تمثيل المدرسة في المسابقات والفعاليات؟',['نعم','لا','حسب المجال'])]),
sec('خامسًا: مقترحاتك','',[tx('ما البرامج أو الأنشطة التي تتمنى أن تقدمها المدرسة لتنمية مواهبك؟'),tx('هل لديك موهبة أو مهارة ترى أنها غير موجودة ضمن الخيارات السابقة؟')])],{collect_identity:true})}
},N={teachers:'المعلمون: المشاركة في خطة النشاط',students:'الطلاب: أثر الأنشطة',parents:'أولياء الأمور: أثر الأنشطة',talents:'استكشاف مواهب وهوايات الطلاب'};
SV.tpl=T;
SV.fromTpl=()=>{SV.cur=T[$('tpl').value]();SV.tab='q';route()};
const _a=SV.adm;SV.adm=()=>{const h=_a();if(SV.cur||SV.list===null||!can('content_edit'))return h;
return h.replace('<div class="panel" style="margin-top:14px">',`<div class="panel"><b>إنشاء من قالب (مسودة قابلة للتعديل)</b> <select id="tpl" style="width:auto">${Object.keys(N).map(k=>`<option value="${k}">${N[k]}</option>`).join('')}</select> <button class="btn s" onclick="SV.fromTpl()">إنشاء</button></div><div class="panel" style="margin-top:14px">`)};
})();
</script>
