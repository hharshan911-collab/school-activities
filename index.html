<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>النشاط الطلابي - مدرسة الشيخ محمد بن عثيمين الثانوية - بنجران</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17302f;--teal:#0e7f8f;--teal2:#e8f6f8;--gold:#f26b1d;--line:#d9e4e4;--bg:#fff;--card:#fff;--mut:#586d6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e4efee;--teal:#5cc7d6;--teal2:#16302f;--gold:#f0a04b;--line:#2c4544;--bg:#0f1c1c;--card:#142526;--mut:#9fb5b4}}
:root[data-theme="dark"]{--ink:#e4efee;--teal:#5cc7d6;--teal2:#16302f;--gold:#f0a04b;--line:#2c4544;--bg:#0f1c1c;--card:#142526;--mut:#9fb5b4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.4;margin:0 0 .4em}img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
header.top{color:#17302f;--teal:#0e7f8f;--mut:#586d6c;--line:#d9e4e4;border-bottom:3px solid var(--gold);background:#fff}
.brand{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0}
.brand h1{font-size:clamp(22px,4.5vw,38px);color:var(--teal);text-align:center;margin:0;flex:1}.brand h1 span{display:block;font-size:clamp(13px,2.2vw,18px);color:var(--ink);font-weight:500}.lg{display:flex;gap:8px;align-items:center}.lg .logo{width:68px;height:68px}
.brand small{display:block;font-size:13px;color:var(--mut);font-weight:400}
.logo{width:96px;height:96px;object-fit:contain;flex:none}.logo-ph{width:84px;height:84px;border:1.5px dashed var(--mut);border-radius:6px;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.4;color:var(--mut);flex:none;padding:4px}
@media(min-width:761px){.brand>.logo,.brand>.logo-ph{width:128px;height:128px}.lg .logo{width:76px;height:76px}}

.avatar{--s:96px;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;display:grid;place-items:center;margin:0 auto 8px;background:var(--teal);color:#fff;font-size:calc(var(--s)/3);flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.av-rounded{border-radius:22%}.av-square{border-radius:4px}.av-oval{height:calc(var(--s)*1.3)}.avatar[onclick]{cursor:zoom-in}
.leader{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}.leader .avatar{--s:200px}
@media(max-width:760px){.leader{grid-template-columns:1fr;text-align:center}}
nav.main{display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line)}
nav.main a{padding:11px 16px;white-space:nowrap;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.main a.on{color:var(--teal);border-color:var(--teal)}
main{padding:28px 0 56px;min-height:60vh}
h2.sec{font-size:24px;color:var(--teal);padding-right:12px;border-right:4px solid var(--gold);margin:34px 0 16px}
.slider{position:relative;aspect-ratio:21/9;min-height:230px;border-radius:10px;overflow:hidden;background:var(--teal2)}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .6s;display:block}.sl.on{opacity:1}
.sl .ph,.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl .cap{position:absolute;inset:auto 0 0 0;padding:44px 24px 20px;background:linear-gradient(transparent,rgba(5,30,30,.85));color:#fff}
.sl .cap h2{margin:0;font-size:clamp(18px,3vw,30px)}.dots{position:absolute;bottom:10px;left:16px;display:flex;gap:6px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.5);padding:0;cursor:pointer}.dots button.on{background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:block;transition:border-color .2s}.card:hover{border-color:var(--teal)}
.cimg{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}.cb{padding:14px 16px}.cb h3{font-size:17px}.cb p{margin:.3em 0 0;color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--teal);color:#fff;font-size:12px;padding:1px 10px;border-radius:20px;font-weight:500}
time{color:var(--mut);font-size:13px;display:block}
.ph{background:linear-gradient(135deg,hsl(var(--h) 42% 36%),hsl(calc(var(--h) + 28) 48% 60%));display:grid;place-items:center}.ph span{color:rgba(255,255,255,.75);font-size:13px}
.ann{border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:12px;background:var(--card)}
.ann.pin{border-color:var(--gold);background:linear-gradient(var(--card),var(--card)) padding-box;border-right:5px solid var(--gold)}
.ann h3{margin:0 0 2px;font-size:18px}.pinb{color:var(--gold);font-size:13px;font-weight:700}
.two{display:grid;grid-template-columns:2fr 1fr;gap:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:var(--card);padding:5px 16px;border-radius:20px;cursor:pointer}.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.post{max-width:780px;margin:auto}.pcover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:16px}.post h1{font-size:30px;color:var(--teal);margin-top:10px}
.body{margin:18px 0}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.thumbs .ph,.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;cursor:zoom-in;display:grid}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:200px 200px;gap:10px}.mosaic>*{border-radius:8px;overflow:hidden;cursor:zoom-in}.mosaic>*:first-child{grid-row:span 2}.mosaic .ph,.mosaic img{width:100%;height:100%;object-fit:cover}
.alb{cursor:pointer;text-align:right;padding:0;font:inherit;display:block;width:100%}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.box{background:var(--teal2);border-radius:8px;padding:18px 22px}.box h3{color:var(--teal)}
#lb,#pv{position:fixed;inset:0;background:rgba(5,20,20,.92);display:none;z-index:50;align-items:center;justify-content:center}#lb.on,#pv.on{display:flex}
#lb .ph,#lb img{width:min(92vw,900px);height:min(70vh,620px);object-fit:contain;border-radius:6px}
#lb button{position:absolute;background:rgba(255,255,255,.15);border:0;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer}
#lb .nx{left:14px;top:50%}#lb .pv{right:14px;top:50%}#lb .x{top:calc(14px + env(safe-area-inset-top,0px));left:14px}#lb .n{position:absolute;bottom:18px;color:#fff;font-size:14px}
#pv .in{background:var(--bg);width:min(860px,94vw);max-height:90vh;overflow:auto;border-radius:10px;padding:20px}
footer{background:var(--teal);color:#fff;padding:22px 0;font-size:14px;text-align:center}footer p{margin:2px 0}
/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh;background:var(--teal2)}
.side{background:var(--teal);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.side h2{font-size:16px;padding:0 10px 12px;border-bottom:1px solid rgba(255,255,255,.25)}
.side button,.side a{display:block;width:100%;text-align:right;background:none;border:0;color:#fff;padding:9px 12px;border-radius:6px;cursor:pointer;opacity:.85}.side button.on{background:rgba(255,255,255,.18);opacity:1;font-weight:700}
.am{padding:24px;min-width:0}.am h1{font-size:24px;color:var(--teal)}
.notice{background:#fff7e0;color:#5c4710;border:1px solid var(--gold);border-radius:6px;padding:8px 14px;font-size:14px;margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px;overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}.stats b{font-size:26px;color:var(--teal);display:block}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:right;padding:8px;border-bottom:1px solid var(--line);font-size:14px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:7px 16px;cursor:pointer;font-weight:500}.btn.o{background:none;color:var(--teal);border:1px solid var(--teal)}.btn.d{background:#b3372f}.btn.s{padding:3px 10px;font-size:13px}
label{display:block;font-weight:500;margin:12px 0 4px}input[type=text],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.mini{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.mini div{width:116px;font-size:12px;text-align:center}.mini .ph,.mini img{width:116px;height:80px;object-fit:cover;border-radius:6px;display:grid}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:30px;z-index:99}
.login{max-width:380px;margin:12vh auto;background:var(--card);padding:26px;border-radius:10px;border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:760px){.adm{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;flex-wrap:wrap}.side h2{width:100%}.side button,.side a{width:auto}.two,.frow{grid-template-columns:1fr}.logo,.logo-ph{width:52px;height:52px}.lg .logo{width:40px;height:40px}.mosaic{grid-template-rows:140px 140px}.slider{aspect-ratio:4/3}}
@media(prefers-reduced-motion:reduce){.sl{transition:none}}

return`<div class="adm"><aside class="side"><h2>لوحة النشاط الطلابي</h2>${nav.map(n=>`<button class="${A.sec===n[0]&&!A.e?'on':''}" onclick="A={sec:'${n[0]}',e:null,al:null};route()">${n[1]}</button>`).join('')}<a href="#/">عرض الموقع</a><button onclick="logout()">تسجيل الخروج</button></aside><section class="am"><div class="notice">التعديلات تُحفظ على الخادم عند الضغط على زر «حفظ»، وما كان «منشورًا» يظهر للزوار مباشرة. المسودات لا تظهر لهم.</div>${m}</section></div>`}
function over(){const n=g=>S.posts.filter(p=>G[g].includes(p.cat)).length;return`<h1>نظرة عامة</h1><div class="stats">${Object.keys(G).map(g=>`<div><b>${n(g)}</b>${GN[g]}</div>`).join('')}<div><b>${S.posts.filter(p=>p.status==='draft').length}</b>مسودات</div><div><b>${S.albums.length}</b>ألبومات</div></div><div class="panel"><h3>آخر المنشورات</h3>${S.posts.slice().sort((a,b)=>b.id-a.id).slice(0,5).map(p=>`<p>${tg(p.cat)} ${esc(p.title)} <span class="tag" style="background:#777">${p.status==='pub'?'منشور':'مسودة'}</span></p>`).join('')}</div>`}
function list(g){const ps=S.posts.filter(p=>G[g].includes(p.cat)),an=g==='announce';return`<h1>${GN[g]}</h1><button class="btn" onclick="newP('${g}')">+ إضافة منشور</button><div class="panel" style="margin-top:14px"><table><tr><th>العنوان</th><th>التصنيف</th><th>التاريخ</th><th>الحالة</th><th>${an?'تثبيت':'العرض الرئيسي'}</th><th>إجراءات</th></tr>${ps.map(p=>`<tr><td>${esc(p.title)}</td><td>${C[p.cat]}</td><td>${fd(p.date)}</td><td>${p.status==='pub'?'منشور':'مسودة'}</td><td><input type="checkbox" ${(an?p.pinned:p.featured)?'checked':''} onchange="tog(${p.id},'${an?'pinned':'featured'}')" aria-label="تفعيل"></td><td><button class="btn s o" onclick="editP(${p.id})">تعديل</button> <button class="btn s o" onclick="prevP(${p.id})">معاينة</button> <button class="btn s d" onclick="delP(${p.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan=6>لا توجد منشورات. أضف أول منشور.</td></tr>'}</table></div>`}
const tog=(id,k)=>{const p=S.posts.find(x=>x.id===id);p[k]=!p[k];save();toast('تم الحفظ')};
const delP=id=>{if(confirm('حذف هذا المنشور نهائيًا؟')){S.posts=S.posts.filter(p=>p.id!==id);save();route();toast('تم الحذف')}};
const newP=g=>{A.e={id:null,cat:G[g][0],title:'',date:new Date().toISOString().slice(0,10),desc:'',cover:170,imgs:[],status:'draft',featured:false,pinned:false};route()};
const editP=id=>{A.e=JSON.parse(JSON.stringify(S.posts.find(p=>p.id===id)));route()};
function prevP(id){const p=id?S.posts.find(x=>x.id===id):A.e;const v=document.getElementById('pv');v.innerHTML=`<div class="in"><button class="btn o s" onclick="document.getElementById('pv').classList.remove('on')">إغلاق المعاينة</button>${postView(p)}</div>`;v.classList.add('on')}
function editor(){const e=A.e,r=document.getElementById('pv');return`<h1>${e.id?'تعديل منشور':'منشور جديد'}</h1><div class="panel"><label>العنوان</label><input type="text" value="${esc(e.title)}" oninput="A.e.title=this.value"><div class="frow"><div><label>التصنيف</label><select onchange="A.e.cat=this.value">${Object.keys(C).map(c=>`<option value="${c}" ${e.cat===c?'selected':''}>${C[c]}</option>`).join('')}</select></div><div><label>التاريخ</label><input type="date" value="${e.date}" onchange="A.e.date=this.value"></div></div><label>الوصف والتفاصيل</label><textarea rows="6" oninput="A.e.desc=this.value">${esc(e.desc)}</textarea><label>صورة الغلاف</label><div class="mini"><div>${img(e.cover,'')}</div></div><input type="file" accept="image/*" onchange="readF(this,s=>{A.e.cover=s;route()})"> <button class="btn s o" onclick="A.e.cover=Math.floor(Math.random()*360);route()">صورة تجريبية</button><label>صور إضافية</label><div class="mini">${e.imgs.map((x,i)=>`<div>${img(x,'')}<button class="btn s d" onclick="A.e.imgs.splice(${i},1);route()">حذف</button></div>`).join('')}</div><input type="file" accept="image/*" multiple onchange="readF(this,s=>{A.e.imgs.push(s);route()})"> <button class="btn s o" onclick="A.e.imgs.push(Math.floor(Math.random()*360));route()">صورة تجريبية</button>
<label>ملفات PDF وفيديو</label><div class="mini" style="display:block">${(e.files||[]).map((x,i)=>`<p style="margin:4px 0">${x.t==='video'?'🎞':'📄'} ${esc(x.n)} <button class="btn s d" onclick="A.e.files.splice(${i},1);route()">حذف</button></p>`).join('')}</div><input type="file" accept="application/pdf,video/*" multiple onchange="addF(this)"><p style="font-size:13px;color:var(--mut)">الملفات تُرفع إلى تخزين دائم (الحد الأقصى للملف الواحد 50 ميغابايت).</p><div class="acts"><button class="btn o" onclick="prevP(0)">معاينة</button><button class="btn o" onclick="savP('draft')">حفظ كمسودة</button><button class="btn" onclick="savP('pub')">نشر الآن</button><button class="btn o" onclick="A.e=null;route()">إلغاء</button></div></div>`}
async function addF(i){const fs=[...i.files];toast('جارٍ الرفع…');A.e.files=A.e.files||[];for(const f of fs){try{A.e.files.push({n:f.name,t:f.type.startsWith('video')?'video':'pdf',u:await up(f)})}catch(e){toast('تعذّر الرفع: '+e.message.slice(0,80))}}route()}
function savP(st){const e=A.e;if(!e.title.trim())return toast('أدخل عنوان المنشور أولًا');e.status=st;if(e.id)S.posts=S.posts.map(p=>p.id===e.id?e:p);else{e.id=S.nid++;S.posts.push(e)}save();A.sec=Object.keys(G).find(g=>G[g].includes(e.cat));A.e=null;route();toast(st==='pub'?'تم النشر':'تم حفظ المسودة')}
function albList(){return`<h1>ألبومات الصور</h1><button class="btn" onclick="S.albums.push({id:S.nid++,title:'ألبوم جديد',imgs:[]});save();A.al=S.albums.length-1;route()">+ ألبوم جديد</button><div class="grid" style="margin-top:14px">${S.albums.map((a,i)=>`<div class="card">${img(cov(a),'cimg')}<div class="cb"><h3>${esc(a.title)}</h3><button class="btn s o" onclick="A.al=${i};route()">تعديل</button> <button class="btn s d" onclick="if(confirm('حذف الألبوم؟')){S.albums.splice(${i},1);save();route()}">حذف</button></div></div>`).join('')}</div>`}
function albEd(){const a=S.albums[A.al];return`<h1>تعديل الألبوم</h1><div class="panel"><label>عنوان الألبوم</label><input type="text" value="${esc(a.title)}" oninput="S.albums[A.al].title=this.value"><label>الصور (الترتيب من اليمين، ★ لاختيار الغلاف)</label><div class="mini">${a.imgs.map((x,i)=>`<div>${img(x.s,'')}${x.c?'<b>الغلاف</b><br>':''}<button class="btn s o" onclick="mv(${i},-1)" aria-label="تقديم">▶</button><button class="btn s o" onclick="mv(${i},1)" aria-label="تأخير">◀</button><button class="btn s o" onclick="cv(${i})" aria-label="غلاف">★</button><button class="btn s d" onclick="S.albums[A.al].imgs.splice(${i},1);route()" aria-label="حذف">×</button></div>`).join('')}</div><input type="file" accept="image/*" multiple onchange="readF(this,s=>{S.albums[A.al].imgs.push({s,c:false});route()})"> <button class="btn s o" onclick="S.albums[A.al].imgs.push({s:Math.floor(Math.random()*360),c:false});route()">صورة تجريبية</button><div class="acts"><button class="btn" onclick="save();A.al=null;route();toast('تم حفظ الألبوم')">حفظ</button></div></div>`}
function mv(i,d){const m=S.albums[A.al].imgs,j=i+d;if(j<0||j>=m.length)return;[m[i],m[j]]=[m[j],m[i]];route()}
const cv=i=>{S.albums[A.al].imgs.forEach((x,k)=>x.c=k===i);route()};
function homeEd(){const h=S.home,ps=S.posts.filter(p=>p.status==='pub'&&p.cat!=='announce'),sel=h.slider.ids.map(i=>S.posts.find(p=>p.id===i)).filter(Boolean),rest=ps.filter(p=>!h.slider.ids.includes(p.id)),KN={news:'الأخبار والتغطيات',ach:'الإنجازات والتكريم',ann:'الإعلانات',rep:'التقارير'};
return`<h1>الصفحة الرئيسية</h1><div class="panel"><h3>الرسالة الترحيبية</h3><label><input type="checkbox" ${h.welcome.show?'checked':''} onchange="S.home.welcome.show=this.checked"> إظهار الرسالة</label><label>العنوان</label><input type="text" value="${esc(h.welcome.title)}" oninput="S.home.welcome.title=this.value"><label>النص</label><textarea rows="3" oninput="S.home.welcome.text=this.value">${esc(h.welcome.text)}</textarea></div>
<div class="panel"><h3>العرض المتحرك</h3><label><input type="checkbox" ${h.slider.show?'checked':''} onchange="S.home.slider.show=this.checked"> إظهار العرض المتحرك</label><p style="font-size:13px;color:var(--mut)">إن لم تختر منشورات يُستخدم المنشورات المميزة تلقائيًا.</p>${sel.map((p,i)=>`<p>${i+1}. ${esc(p.title)} <button class="btn s o" onclick="hMv('ids',${i},-1)" aria-label="أعلى">▲</button> <button class="btn s o" onclick="hMv('ids',${i},1)" aria-label="أسفل">▼</button> <button class="btn s d" onclick="S.home.slider.ids.splice(${i},1);route()">إزالة</button></p>`).join('')}<div class="frow"><select id="hs">${rest.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><div><button class="btn s o" onclick="hAdd()">+ إضافة للعرض</button></div></div><label>شرائح مخصصة (صورة وعنوان)</label>${h.slider.custom.map((c,i)=>`<div class="frow" style="margin-bottom:6px"><div class="mini" style="margin:0"><div>${img(c.s,'')}</div></div><div style="display:flex;gap:6px"><input type="text" value="${esc(c.ti)}" oninput="S.home.slider.custom[${i}].ti=this.value"><button class="btn s d" onclick="S.home.slider.custom.splice(${i},1);route()">حذف</button></div></div>`).join('')}<input type="file" accept="image/*" onchange="readF(this,x=>{S.home.slider.custom.push({s:x,ti:'عنوان الشريحة'});route()})"> <button class="btn s o" onclick="S.home.slider.custom.push({s:Math.floor(Math.random()*360),ti:'عنوان الشريحة'});route()">شريحة تجريبية</button></div>
<div class="panel"><h3>أقسام الصفحة (الترتيب والإظهار والعناوين)</h3><table><tr><th>الترتيب</th><th>إظهار</th><th>القسم</th><th>العنوان</th><th>العدد</th></tr>${h.secs.map((x,i)=>`<tr><td><button class="btn s o" onclick="hMv('secs',${i},-1)" aria-label="أعلى">▲</button> <button class="btn s o" onclick="hMv('secs',${i},1)" aria-label="أسفل">▼</button></td><td><input type="checkbox" ${x.show?'checked':''} onchange="S.home.secs[${i}].show=this.checked" aria-label="إظهار"></td><td>${KN[x.k]}</td><td><input type="text" value="${esc(x.t)}" oninput="S.home.secs[${i}].t=this.value"></td><td><input type="text" style="width:60px" value="${x.n}" oninput="S.home.secs[${i}].n=Math.max(1,+this.value||1)"></td></tr>`).join('')}</table></div>
<div class="acts"><button class="btn" onclick="save();toast('تم حفظ الصفحة الرئيسية')">حفظ</button><button class="btn o" onclick="go('#/')">معاينة الصفحة الرئيسية</button><button class="btn o" onclick="if(confirm('استعادة الإعدادات الافتراضية؟')){S.home=HOME();save();route()}">استعادة الافتراضي</button></div>`}
function hMv(k,i,d){const a=k==='ids'?S.home.slider.ids:S.home.secs,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];route()}
function hAdd(){const v=+(document.getElementById('hs')||{}).value;if(v){S.home.slider.ids.push(v);route()}}
function leaderEd(){const l=S.org.leader,gr=(k,t)=>`<label>${t}</label><div class="mini">${l[k].map((x,i)=>`<div>${img(x,'')}<button class="btn s d" onclick="S.org.leader.${k}.splice(${i},1);route()">حذف</button></div>`).join('')}</div><input type="file" accept="image/*" multiple onchange="readF(this,x=>{S.org.leader.${k}.push(x);route()})"> <button class="btn s o" onclick="S.org.leader.${k}.push(Math.floor(Math.random()*360));route()">صورة تجريبية</button>`;
return`<h1>رائد النشاط</h1><div class="panel"><label>اسم رائد النشاط</label><input type="text" value="${esc(l.n)}" oninput="S.org.leader.n=this.value"><label>المسمى</label><input type="text" value="${esc(l.t)}" oninput="S.org.leader.t=this.value"><label>نبذة</label><textarea rows="4" oninput="S.org.leader.bio=this.value">${esc(l.bio)}</textarea><label>الصورة الشخصية</label><span id="av_L">${av(l,96)}</span><input type="file" accept="image/*" onchange="readF(this,x=>{S.org.leader.p=x;route()})"> <button class="btn s d" onclick="S.org.leader.p='';route()">إزالة الصورة</button>${l.p?avCtl('L'):''}${gr('certs','صور الشهادات')}${gr('courses','صور الدورات')}<div class="acts"><button class="btn" onclick="save();toast('تم حفظ البيانات')">حفظ</button><button class="btn o" onclick="go('#/leader')">معاينة الصفحة</button></div></div>`}
async function pdfF(inp,i){const f=inp.files[0];if(!f)return;toast('جارٍ الرفع…');try{S.reports[i].u=await up(f);S.reports[i].n=f.name;route();toast('تم الرفع، اضغط حفظ')}catch(e){toast('تعذّر الرفع: '+e.message.slice(0,80))}}
function repEd(){return`<h1>تقارير النشاط الطلابي</h1><button class="btn" onclick="S.reports.push({id:S.nid++,title:'تقرير جديد',date:new Date().toISOString().slice(0,10),u:'',n:''});route()">+ تقرير جديد</button><p style="font-size:13px;color:var(--mut)">في النموذج التجريبي يُحفظ ملف PDF في تخزين دائم؛ اضغط «حفظ» بعد الرفع.</p>${S.reports.map((x,i)=>`<div class="panel"><div class="frow"><div><label>عنوان التقرير</label><input type="text" value="${esc(x.title)}" oninput="S.reports[${i}].title=this.value"></div><div><label>التاريخ</label><input type="date" value="${x.date}" onchange="S.reports[${i}].date=this.value"></div></div><label>ملف PDF ${x.u?'— '+esc(x.n):'(لم يُرفع)'}</label><input type="file" accept="application/pdf" onchange="pdfF(this,${i})"> <button class="btn s d" onclick="if(confirm('حذف التقرير؟')){S.reports.splice(${i},1);save();route()}">حذف التقرير</button></div>`).join('')||'<p>لا توجد تقارير.</p>'}<div class="acts"><button class="btn" onclick="save();toast('تم حفظ التقارير')">حفظ</button><button class="btn o" onclick="go('#/reports')">معاينة الصفحة</button></div>`}
function aboutEd(){const o=S.org;return`<h1>بيانات النشاط والفريق</h1><div class="panel"><label>اسم المدرسة</label><input type="text" value="${esc(o.sname)}" oninput="S.org.sname=this.value"><div class="frow"><div><label>شعار النشاط الطلابي</label>${logo(o.logo,'شعار النشاط')}<input type="file" accept="image/*" onchange="readF(this,x=>{S.org.logo=x;route()})"></div><div><label>شعار المدرسة</label>${logo(o.school,'شعار المدرسة')}<input type="file" accept="image/*" onchange="readF(this,x=>{S.org.school=x;route()})"></div></div><label>شعار وزارة التعليم</label>${logo(o.moe,'شعار الوزارة')}<input type="file" accept="image/*" onchange="readF(this,x=>{S.org.moe=x;route()})"><label>تعريف بالنشاط الطلابي</label><textarea rows="4" oninput="S.org.about=this.value">${esc(o.about)}</textarea><label>الأهداف (هدف في كل سطر)</label><textarea rows="4" oninput="S.org.goals=this.value.split('\n').filter(Boolean)">${esc(o.goals.join('\n'))}</textarea><label>المجالات (مجال في كل سطر)</label><textarea rows="4" oninput="S.org.fields=this.value.split('\n').filter(Boolean)">${esc(o.fields.join('\n'))}</textarea><label>فريق العمل</label>${o.team.map((t,i)=>`<div class="panel" style="background:var(--teal2)"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span id="av_${i}">${av(t,64)}</span><div><input type="file" accept="image/*" onchange="readF(this,x=>{S.org.team[${i}].p=x;route()})" aria-label="صورة العضو"> ${t.p?`<button class="btn s d" onclick="S.org.team[${i}].p='';route()">إزالة الصورة</button>`:''}</div></div>${t.p?avCtl(i):''}<div class="frow"><div><label>الاسم</label><input type="text" value="${esc(t.n)}" oninput="S.org.team[${i}].n=this.value"></div><div><label>المهمة</label><input type="text" value="${esc(t.r)}" oninput="S.org.team[${i}].r=this.value"></div></div><div class="acts"><button class="btn s d" onclick="S.org.team.splice(${i},1);route()">حذف العضو</button></div></div>`).join('')}<button class="btn s o" onclick="S.org.team.push({n:'اسم جديد',r:'المهمة',p:''});route()">+ إضافة عضو</button><div class="acts"><button class="btn" onclick="save();toast('تم حفظ البيانات')">حفظ التعديلات</button><button class="btn o" onclick="if(confirm('سيُستبدل كل المحتوى الحالي بالمحتوى التجريبي. متأكد؟')){S=seed();save();route()}">استعادة المحتوى التجريبي</button></div></div>`}
/* ---------- router ---------- */
function route(){PV=[];clearInterval(timer);const h=H;const adm=h.startsWith('#/admin');const y=scrollY;document.title='النشاط الطلابي - '+S.org.sname;
document.getElementById('app').innerHTML=adm?(auth?admin():login()):pubPage(h);
if(!adm&&document.getElementById('sld'))goS(0);}
let H='#/';
function go(h){H=h;try{history.pushState(null,'',h)}catch(e){}closeLB();document.getElementById('pv').classList.remove('on');scrollTo(0,0);route()}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href'))}});
try{if(location.hash.length>2)H=location.hash}catch(e){}
addEventListener('popstate',()=>{try{H=location.hash||'#/'}catch(e){}route()});addEventListener('hashchange',()=>{try{if(location.hash&&location.hash!==H){H=location.hash;route()}}catch(e){}});
boot();
</script></body></html>
